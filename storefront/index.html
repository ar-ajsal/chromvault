<!-- ==========================================================================
     SVG filter defs. The turbulence/displacement pair is what turns the
     rotating conic gradients into liquid metal rather than a pinwheel. It is
     static (no animated attributes) so it rasterises once.
     ====================================================================== -->
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <defs>
    <filter id="liquid-distort" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.014" numOctaves="3" seed="7" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="46" xChannelSelector="R" yChannelSelector="G" result="disp" />
      <feGaussianBlur in="disp" stdDeviation="0.4" />
    </filter>
  </defs>
</svg>

<!-- ===================== HEADER ===================== -->
<header class="hdr" id="hdr">

<script>
  // Storefront PWA. The service worker never caches /api or /v1 responses —
  // see service-worker.js. Registration is deferred to after load so it never
  // competes with first-paint or the initial product fetch.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/service-worker.js').catch(function (err) {
        console.warn('Storefront SW registration failed:', err);
      });
    });
  }
</script>
