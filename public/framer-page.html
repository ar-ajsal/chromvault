<script>
let gsapInitTimeout;

function initAllGSAPAnimations() {
  if (!window.gsap) return;

  const cards = [...document.querySelectorAll('[data-framer-name="Service Card"]')];
  if (cards.length) {
    let activeCard = null;
    const EXPANDED = 2;
    const COLLAPSED = 0.9;
    const DURATION = 1.8;
    const EASE = "expo.out";

    function animateCards(target) {
      activeCard = target;
      cards.forEach(card => {
        gsap.killTweensOf(card);
        gsap.to(card, {
          flexGrow: card === target ? EXPANDED : COLLAPSED,
          duration: DURATION,
          ease: EASE,
          overwrite: true
        });
      });
    }

    function resetCards() {
      if (!activeCard) return;
      activeCard = null;
      cards.forEach(card => {
        gsap.killTweensOf(card);
        gsap.to(card, {
          flexGrow: 1,
          duration: DURATION,
          ease: EASE,
          overwrite: true
        });
      });
    }

    cards.forEach(card => {
      if (card.__gsapBound) return;
      card.__gsapBound = true;
      card.addEventListener("pointerenter", () => animateCards(card));
      card.addEventListener("click", e => {
        e.stopPropagation();
        animateCards(card);
      });
    });

    document.addEventListener("pointerleave", resetCards);
    document.addEventListener("click", resetCards);
  }

  function animateSVGGradient(id, y, duration) {
    const el = document.querySelector(id);
    if (!el || el.__gsapAnimated) return;

    el.__gsapAnimated = true;
    el.setAttribute("gradientUnits", "userSpaceOnUse");

    gsap.fromTo(
      el,
      { attr: { gradientTransform: "translate(0 0)" } },
      {
        attr: { gradientTransform: `translate(0 ${y})` },
        duration,
        ease: "sine.inOut",
        repeat: -1,
        yoyo: true
      }
    );
  }

  animateSVGGradient("#paint0_linear_2005_48", -120, 6);
  animateSVGGradient("#paint0_linear_1_704", -60, 6);

  ["#paint0_radial_1_954","#paint1_linear_1_954","#paint2_linear_1_954"].forEach(id =>
    animateSVGGradient(id, -60, 5)
  );

  ["#paint0_radial_1_496","#paint1_linear_1_496","#paint2_linear_1_496"].forEach(id =>
    animateSVGGradient(id, -50, 5)
  );

  document.querySelectorAll('[data-framer-name="Button Gradient Effect"]').forEach(btn => {
    if (btn.__gsapAnimated) return;
    btn.__gsapAnimated = true;
    const g = { a: 0 };
    gsap.to(g, {
      a: 360,
      duration: 6,
      repeat: -1,
      ease: "none",
      onUpdate: () => {
        btn.style.background = `linear-gradient(
          ${g.a}deg,
          rgb(255,255,255) 8%,
          rgba(255,255,255,.1) 29%,
          rgba(255,255,255,.1) 88%,
          rgba(255,255,255,0) 100%
        )`;
      }
    });
  });

  document.querySelectorAll('[data-framer-name="Frame Gradient Effect"]').forEach(frame => {
    if (frame.__gsapAnimated) return;
    frame.__gsapAnimated = true;
    const g = { a: 0 };
    gsap.to(g, {
      a: 360,
      duration: 10,
      repeat: -1,
      ease: "none",
      onUpdate: () => {
        frame.style.background = `linear-gradient(
          ${g.a}deg,
          rgba(255,117,66,.76) 0%,
          rgba(179,70,164,.42) 12%,
          rgba(80,115,255,.39) 19%,
          rgba(94,164,255,.6) 24%,
          rgba(255,255,255,0) 46%
        )`;
      }
    });
  });
}

window.addEventListener("load", initAllGSAPAnimations);

if (!window.__FRAMER_GSAP_OBSERVER__) {
  window.__FRAMER_GSAP_OBSERVER__ = new MutationObserver(() => {
    clearTimeout(gsapInitTimeout);
    gsapInitTimeout = setTimeout(initAllGSAPAnimations, 100);
  });

  window.__FRAMER_GSAP_OBSERVER__.observe(document.body, {
    childList: true,
    subtree: true
  });
}
</script>
